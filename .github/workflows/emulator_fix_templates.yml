name: JOB SRO - Android templates (4.7.2 + emulator Swappy fix)
# Builds the Godot 4.7.2 Android export templates (arm64-v8a + x86_64, template_release + template_debug) from
# this branch = tag 4.7.2-stable + the cherry-pick of godotengine/godot PR #121701 (Swappy: register the stored
# VkQueue instead of calling vkGetDeviceQueue again - fixes "Couldn't present to Vulkan queue" black screens on
# Android emulators). Same flags as the official templates for this purpose: swappy=yes production=yes.
on:
  push:
    branches: [4.7.2-emulator-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.target }} ${{ matrix.arch }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        target: [template_release, template_debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: SCons
        run: python -m pip install scons==4.10.1
      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py
      - name: Build
        env:
          BUILD_NAME: jobsro_emufix
        run: |
          rm -rf editor
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} swappy=yes production=yes -j$(nproc)
          ls -l bin/
          find platform/android/java/lib/libs -type f | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.target }}-${{ matrix.arch }}
          path: platform/android/java/lib/libs/
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: SCons (Gradle's lib project looks the command up while configuring)
        run: python -m pip install scons==4.10.1
      - uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          path: platform/android/java/lib/libs/
          merge-multiple: true
      - name: Generate Godot templates
        run: |
          find platform/android/java/lib/libs -type f
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/
      - uses: actions/upload-artifact@v4
        with:
          name: android-templates-4.7.2-emulator-fix
          path: bin/*
          retention-days: 30
