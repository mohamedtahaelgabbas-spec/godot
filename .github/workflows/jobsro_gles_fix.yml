name: JOB SRO - Android templates (4.7.2 + GLES3 UBO generic-binding fix)
# Builds the Godot 4.7.2 Android export templates (arm64-v8a + x86_64 + armeabi-v7a, template_release + template_debug) from
# this branch = tag 4.7.2-stable + ONE driver change in drivers/gles3: every glBindBufferBase(GL_UNIFORM_BUFFER, i, b)
# is followed by glBindBuffer(GL_UNIFORM_BUFFER, b). Per the GL spec glBindBufferBase already sets that generic
# binding, so conformant drivers see no change; LDPlayer's GLES encoder does not track it and rejected every
# per-frame UBO upload (glBufferData "bufferId==0") -> the camera / scene data froze on the Compatibility
# renderer. Vulkan code is untouched. Same flags as the official templates: swappy=yes production=yes.
on:
  push:
    branches: [4.7.2-gles-ubo-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.target }} ${{ matrix.arch }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, armv7]
        target: [template_release, template_debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: SCons
        run: python -m pip install scons==4.10.1
      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py
      - name: Build
        env:
          BUILD_NAME: jobsro_glesfix
        run: |
          rm -rf editor
          scons platform=android target=${{ matrix.target }} arch=${{ matrix.arch }} swappy=yes production=yes -j$(nproc)
          ls -l bin/
          find platform/android/java/lib/libs -type f | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.target }}-${{ matrix.arch }}
          path: platform/android/java/lib/libs/
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: SCons (Gradle's lib project looks the command up while configuring)
        run: python -m pip install scons==4.10.1
      - uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          path: platform/android/java/lib/libs/
          merge-multiple: true
      - name: Generate Godot templates
        run: |
          find platform/android/java/lib/libs -type f
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/
      - uses: actions/upload-artifact@v4
        with:
          name: android-templates-4.7.2-gles-ubo-fix
          path: bin/*
          retention-days: 30
